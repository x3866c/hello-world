name: Engine Android

# Builds the patched Flutter engine (private repo reeden-org/flutter) as release libflutter.so for
# armeabi-v7a / arm64-v8a / x86_64 and publishes it as a release of that repo
# (tag android-engine-<Flutter version>-<first 10 chars of the commit>).
# Secrets: ENGINE_TOKEN (falls back to GIT_PAT) — needs read access and release (contents) write on reeden-org/flutter.

run-name: Engine Android (${{ inputs.ref }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of reeden-org/flutter"
        type: string
        default: patched/3.44.9

permissions:
  contents: read

env:
  ENGINE_REPO: reeden-org/flutter

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve commit
        id: resolve
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN || secrets.GIT_PAT }}
          REF: ${{ inputs.ref }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$REF"
          else
            sha=$(git -c "http.https://github.com/.extraheader=$auth" ls-remote "https://github.com/$ENGINE_REPO.git" \
              "refs/heads/$REF" "refs/tags/$REF" | head -1 | cut -f1)
          fi
          test -n "$sha" || { echo "Cannot resolve $REF"; exit 1; }
          version=$(echo "$REF" | sed -E 's|^patched/||; s|-ohos$||')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || version=unknown
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $ENGINE_REPO@$sha (Flutter $version)"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        include:
          - cpu: arm
            out: android_release
            abi: armeabi-v7a
          - cpu: arm64
            out: android_release_arm64
            abi: arm64-v8a
          - cpu: x64
            out: android_release_x64
            abi: x86_64
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /opt/az /usr/lib/jvm || true
          sudo docker image prune --all --force > /dev/null || true
          sudo apt-get clean
          df -h

      - name: Work directory
        # Not $HOME/work: GitHub checks out repositories there.
        run: mkdir -p "$HOME/engine-build" && echo "WORK=$HOME/engine-build" >> "$GITHUB_ENV"

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$WORK/depot_tools"
          echo "$WORK/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch sources and engine dependencies
        env:
          ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN || secrets.GIT_PAT }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ENGINE_TOKEN" | base64 | tr -d '\n')"
          git init -q "$WORK/flutter"
          cd "$WORK/flutter"
          git -c "http.https://github.com/.extraheader=$auth" fetch -q --depth 1 "https://github.com/$ENGINE_REPO.git" "$SHA"
          git checkout -q FETCH_HEAD
          cat > .gclient <<'GCLIENT'
          solutions = [
            {
              "custom_deps": {},
              "deps_file": "DEPS",
              "managed": False,
              "name": ".",
              "safesync_url": "",
              "url": "https://github.com/flutter/flutter.git",
              "custom_vars": {
                "download_fuchsia_deps": False,
                "download_esbuild": False,
              },
            },
          ]
          GCLIENT
          gclient sync --no-history --shallow -D

      - name: Build ${{ matrix.out }}
        run: |
          cd "$WORK/flutter/engine/src"
          ./flutter/tools/gn --runtime-mode release --android --android-cpu ${{ matrix.cpu }} --no-rbe --no-goma
          ninja -C out/${{ matrix.out }} flutter/shell/platform/android:android_jar
          mkdir -p "$WORK/dist/${{ matrix.abi }}"
          cp out/${{ matrix.out }}/lib.stripped/libflutter.so "$WORK/dist/${{ matrix.abi }}/libflutter.so"
          ls -lh "$WORK/dist/${{ matrix.abi }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libflutter-${{ matrix.abi }}
          path: ${{ env.WORK }}/dist/${{ matrix.abi }}/libflutter.so
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download the three ABIs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mkdir -p "dist/$abi"
            cp "artifacts/libflutter-$abi/libflutter.so" "dist/$abi/libflutter.so"
          done
          tar -C dist -czf android-release-libflutter.tar.gz armeabi-v7a arm64-v8a x86_64
          sha256sum android-release-libflutter.tar.gz | tee android-release-libflutter.tar.gz.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.ENGINE_TOKEN || secrets.GIT_PAT }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="android-engine-$VERSION-${SHA:0:10}"
          notes="Flutter $VERSION + patches, commit $SHA. Release libflutter.so for armeabi-v7a / arm64-v8a / x86_64; replace the one from the official engine of the same Flutter version.

          sha256: $(cut -d' ' -f1 android-release-libflutter.tar.gz.sha256)"
          gh release create "$tag" android-release-libflutter.tar.gz android-release-libflutter.tar.gz.sha256 \
            --repo "$ENGINE_REPO" --target "$SHA" --title "$tag" --notes "$notes"
          echo "Published $tag"
