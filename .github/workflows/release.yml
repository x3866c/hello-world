name: Release App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to release"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - Android
          - iOS
          - Windows
          - Linux
          - Macos

# Declare default permissions as readonly.
permissions: read-all

env:
  APP_NAME: ${{ secrets.APP_NAME }}

jobs:
  prepare:
    name: Prepare Release Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          PLATFORM="${{ inputs.platform }}"
          case "$PLATFORM" in
            all)
              MATRIX='{"include":[{"platform":"Android","runs-on":"ubuntu-22.04","flutter-version":"3.38.7","build-script":"bash scripts/package/android.sh"},{"platform":"iOS","runs-on":"macos-26","flutter-version":"3.41.6","build-script":"bash scripts/package/ios.sh"},{"platform":"Windows","runs-on":"windows-latest","flutter-version":"3.41.6","build-script":"./scripts/package/windows.ps1"},{"platform":"Linux","runs-on":"ubuntu-24.04","flutter-version":"3.41.6","build-script":"./scripts/package/linux.sh"},{"platform":"Macos","runs-on":"macos-26","flutter-version":"3.41.6","build-script":"bash scripts/package/macos.sh"}]}'
              ;;
            Android)
              MATRIX='{"include":[{"platform":"Android","runs-on":"ubuntu-22.04","flutter-version":"3.38.7","build-script":"bash scripts/package/android.sh"}]}'
              ;;
            iOS)
              MATRIX='{"include":[{"platform":"iOS","runs-on":"macos-26","flutter-version":"3.41.6","build-script":"bash scripts/package/ios.sh"}]}'
              ;;
            Windows)
              MATRIX='{"include":[{"platform":"Windows","runs-on":"windows-latest","flutter-version":"3.41.6","build-script":"./scripts/package/windows.ps1"}]}'
              ;;
            Linux)
              MATRIX='{"include":[{"platform":"Linux","runs-on":"ubuntu-24.04","flutter-version":"3.41.6","build-script":"./scripts/package/linux.sh"}]}'
              ;;
            Macos)
              MATRIX='{"include":[{"platform":"Macos","runs-on":"macos-26","flutter-version":"3.41.6","build-script":"bash scripts/package/macos.sh"}]}'
              ;;
            *)
              echo "Unknown platform: $PLATFORM" >&2
              exit 1
              ;;
          esac
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Package ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.platform == 'Android'
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GIT_REPO }}
          ref: main
          token: ${{ secrets.GIT_PAT }}

      - name: Setup Java
        if: matrix.platform == 'Android'
        uses: actions/setup-java@v4
        with:
          java-version: "17.x"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.flutter-version }}

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Stable Appcast
        run: dart scripts/release.dart --appcast-only --channel stable
        shell: bash

      - name: Build ${{ matrix.platform }}
        if: matrix.platform != 'Windows'
        run: ${{ matrix.build-script }}
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        shell: bash

      - name: Build ${{ matrix.platform }}
        if: matrix.platform == 'Windows'
        run: ${{ matrix.build-script }}
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        shell: pwsh

      - name: Mirror signed macOS appcast to beta channel
        if: matrix.platform == 'Macos'
        run: |
          mkdir -p artifacts/beta/latest
          cp artifacts/latest/macos*.xml artifacts/beta/latest/
        shell: bash

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep "version:" pubspec.yaml | head -1 | sed 's/version: //' | sed 's/+.*$//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: artifacts
          output-file-url: false
          destination-dir: ${{ secrets.APP_NAME }}

      - name: Upload Symbols to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_KEY }}
          r2-bucket: privatedata
          source-dir: symbols
          output-file-url: false
          destination-dir: ${{ secrets.APP_NAME }}/symbols

      # - name: Upload Release Artifacts to 123Pan WebDAV
      #   run: |
      #     VERSION=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -1)
      #     PAN123_WEBDAV_SUBDIRECTORY="$VERSION" bash scripts/package/upload_123pan_webdav.sh "artifacts/$VERSION"
      #   env:
      #     AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      #   shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: matrix.platform != 'iOS'
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Release v${{ steps.version.outputs.version }}"
          files: |
            artifacts/latest/*.apk
            artifacts/latest/*.exe
            artifacts/latest/*.zip
            artifacts/latest/*.dmg
            artifacts/latest/*.deb
            artifacts/latest/*.rpm
            artifacts/latest/*.appimage
            artifacts/latest/*.app
          body_path: documents/changelog.md
          repository: ${{ secrets.RELEASE_REPO }}
          token: ${{ secrets.GIT_PAT }}
          draft: false
          prerelease: false

  appcast:
    name: Upload Appcast to R2
    runs-on: ubuntu-latest
    needs: [prepare, release]
    if: ${{ inputs.platform == 'all' || inputs.platform == 'Android' || inputs.platform == 'iOS' || inputs.platform == 'Windows' || inputs.platform == 'Linux' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GIT_REPO }}
          ref: main
          token: ${{ secrets.GIT_PAT }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.6"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Appcast
        run: |
          dart scripts/release.dart --appcast-only --channel stable
          mkdir -p artifacts/latest
          mkdir -p artifacts/beta/latest

          copy_appcast() {
            local platform="$1"
            cp documents/appcast/${platform}*.xml artifacts/latest/
            cp documents/appcast/${platform}*.xml artifacts/beta/latest/
          }

          case "${{ inputs.platform }}" in
            all)
              for platform in windows android linux ios; do
                copy_appcast "$platform"
              done
              ;;
            Android)
              copy_appcast android
              ;;
            iOS)
              copy_appcast ios
              ;;
            Windows)
              copy_appcast windows
              ;;
            Linux)
              copy_appcast linux
              ;;
          esac

      - name: Upload to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: artifacts
          output-file-url: false
          destination-dir: ${{ secrets.APP_NAME }}
